name: Build release AAB

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and patch Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-src
          tr -d '\n\r' < ci/mungnyang-ci-source.zip.b64 | base64 -d > /tmp/mungnyang-ci-source.zip
          echo "b8b25ac7f088d06a5b5f270e6dd7a86e604364960e925e1e3d8d60dd2c6d358e  /tmp/mungnyang-ci-source.zip" | sha256sum -c -
          unzip -q /tmp/mungnyang-ci-source.zip -d android-src
          tr -d '\n\r' < ci/v028.patch.gz.b64 | base64 -d | gzip -dc > /tmp/v028.patch
          cd android-src
          patch -p1 < /tmp/v028.patch
          echo "android.disallowKotlinSourceSets=false" >> gradle.properties
          sed -i 's/androidx.compose:compose-bom:2026.09.00/androidx.compose:compose-bom:2025.08.00/' app/build.gradle.kts
          sed -i 's/androidx.core:core:1.19.0/androidx.core:core:1.17.0/' app/build.gradle.kts
          sed -i 's/androidx.activity:activity-compose:1.13.0/androidx.activity:activity-compose:1.11.0/' app/build.gradle.kts
          sed -i 's/androidx.lifecycle:lifecycle-runtime-ktx:2.11.0/androidx.lifecycle:lifecycle-runtime-ktx:2.9.4/' app/build.gradle.kts
          sed -i 's/androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0/androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4/' app/build.gradle.kts
          sed -i 's/androidx.lifecycle:lifecycle-runtime-compose:2.11.0/androidx.lifecycle:lifecycle-runtime-compose:2.9.4/' app/build.gradle.kts
          sed -i 's/Modifier.menuAnchor(ExposedDropdownMenuAnchorType.PrimaryNotEditable)/Modifier.menuAnchor()/g' app/src/main/java/com/petmeal/calculator/ui/MainScreen.kt app/src/main/java/com/petmeal/calculator/ui/OnboardingScreen.kt
          sed -i 's/import androidx.glance.action.actionRunCallback/import androidx.glance.appwidget.action.actionRunCallback/' app/src/main/java/com/petmeal/calculator/widget/FeedingWidget.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify version source
        working-directory: android-src
        run: |
          grep '^VERSION_NAME=0.2.8$' version.properties
          grep '^VERSION_CODE=10$' version.properties

      - name: Run unit tests
        working-directory: android-src
        run: gradle --no-daemon test

      - name: Build unsigned release AAB
        working-directory: android-src
        run: gradle --no-daemon --stacktrace bundleRelease

      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail
          test -s android-src/app/build/outputs/bundle/release/app-release.aab
          sha256sum android-src/app/build/outputs/bundle/release/app-release.aab

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: mungnyang-0.2.8-vc10-unsigned-aab
          path: android-src/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
