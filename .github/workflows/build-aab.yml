name: Build release AAB

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-src
          tr -d '\n\r' < ci/mungnyang-ci-source.zip.b64 | base64 -d > /tmp/mungnyang-ci-source.zip
          echo "b8b25ac7f088d06a5b5f270e6dd7a86e604364960e925e1e3d8d60dd2c6d358e  /tmp/mungnyang-ci-source.zip" | sha256sum -c -
          unzip -q /tmp/mungnyang-ci-source.zip -d android-src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-37"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run unit tests
        working-directory: android-src
        run: gradle --no-daemon test

      - name: Build unsigned release AAB
        working-directory: android-src
        run: gradle --no-daemon --stacktrace bundleRelease

      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail
          test -s android-src/app/build/outputs/bundle/release/app-release.aab
          sha256sum android-src/app/build/outputs/bundle/release/app-release.aab

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: mungnyang-0.2.7-vc9-unsigned-aab
          path: android-src/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
